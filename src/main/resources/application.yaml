spring:
  application:
    name: CareerLog
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/careerlog}
    username: ${DB_USERNAME:careerlog_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
